name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven (Skip Tests)
      run: mvn clean install -DskipTests
      
    - name: Run Unit Tests
      run: mvn test -pl order-service,matching-engine,risk-service,margin-service,compliance-service
      
    - name: Run Integration Tests
      run: mvn test -pl integration-tests
